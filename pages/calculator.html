<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="../calculator.css" />
  </head>
  <body>
    <head>
      <h1>Calculator x Rama</h1>
    </head>
    <main>
      <div class="calculator-output">0</div>
      <div class="button">
        <div class="button-keys">
          <button class="keys">Deg</button>
          <button class="keys">Rad</button>
          <button class="keys">x!</button>

          <button class="keys">Inv</button>
          <button class="keys">sin</button>
          <button class="keys">In</button>

          <button class="keys">π</button>
          <button class="keys">cos</button>
          <button class="keys">log</button>

          <button class="keys">e</button>
          <button class="keys">tab</button>
          <button class="keys">√</button>

          <button class="keys">Ans</button>
          <button class="keys">Exp</button>
          <button class="keys">x"y</button>
        </div>

        <div class="number">
          <button class="keys">(</button>
          <button class="keys">)</button>
          <button class="keys">%</button>
          <button class="keys">CE</button>

          <button class="keys">7</button>
          <button class="keys">8</button>
          <button class="keys">9</button>
          <button class="keys">/</button>

          <button class="keys">4</button>
          <button class="keys">5</button>
          <button class="keys">6</button>
          <button class="keys">x</button>

          <button class="keys">1</button>
          <button class="keys">2</button>
          <button class="keys">3</button>
          <button class="keys">-</button>

          <button class="keys">0</button>
          <button class="keys">.</button>
          <button class="keys">=</button>
          <button class="keys">+</button>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
