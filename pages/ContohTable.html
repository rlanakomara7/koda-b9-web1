<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
  </head>
  <body>
    <table border="2">
      <caption>
        Jumlah Mahasiswa Universitas Y
      </caption>
      <thead>
        <tr>
          <th rowspan="2" scope="col">Jurusan</th>
          <th colspan="4" scope="colgroup">Semester</th>
          <th rowspan="2" scope="col">Jumlah</th>
        </tr>
        <tr>
          <th scope="col">I</th>
          <th scope="col">II</th>
          <th scope="col">III</th>
          <th scope="col">IV</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Ekonomi</th>
          <td>100</td>
          <td>90</td>
          <td>120</td>
          <td>80</td>
          <td>390</td>
        </tr>
        <tr>
          <th scope="row">Hukum</th>
          <td>80</td>
          <td>110</td>
          <td>70</td>
          <td>100</td>
          <td>360</td>
        </tr>
        <tr>
          <th scope="row">Teknik</th>
          <td>75</td>
          <td>110</td>
          <td>100</td>
          <td>60</td>
          <td>345</td>
        </tr>
        <tr>
          <th scope="row">Jumlah</th>
          <td>275</td>
          <td>280</td>
          <td>330</td>
          <td>210</td>
          <td>1095</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
