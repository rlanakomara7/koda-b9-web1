<!doctype html>
<html lang="en">
  <head>
    <!-- Invisible metadata and configuration -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Header</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="bodysticky">
    <header class="navlist">
      <h1>My Minitask</h1>
      <nav>
        <ul class="navbar">
          <li><a href="#about">About</a></li>
          <li><a href="#services">Services</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="about">
        <h2>About Us</h2>
        <p>This is my minitask web Koda Academy.</p>
        <img src="../assets/Koda.webp" alt="" style="width: 200px" />
      </section>

      <section id="services">
        <h2>Our Services</h2>
        <ul>
          <li>Web Design</li>
          <li>Search Engine Optimization (SEO)</li>
          <li>Content Creation</li>
        </ul>
      </section>

      <section id="contact">
        <h2>Contact Us</h2>
        <form action="#" method="POST">
          <label for="name">Name:</label><br />
          <input type="text" id="name" name="name" required /><br /><br />

          <label for="email">Email:</label><br />
          <input type="email" id="email" name="email" required /><br /><br />

          <button type="submit">Submit</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 My Website. Rama Lana Komara</p>
    </footer>
    <a href="https://www.linkedin.com/in/rama-lana-komara/"
      ><img
        class="linkedin"
        src="../assets/round-linkedin-logo-isolated-white-background_469489-985.avif"
        alt=""
    /></a>
  </body>
</html>
